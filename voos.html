:root{--navy:#0b1a2c;--accent:#e4572e;--ink:#0d1b2a;--muted:#5b6776;--line:#e3e8ef;--bg:#f4f6f9;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;padding:12px 12px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:20px;padding:12px 18px;border:1px solid var(--line)}
.nv-word{display:inline-flex;align-items:center;gap:11px;color:var(--navy);text-decoration:none;line-height:0}
.nv-ico{width:38px;height:38px;flex:none}
.nv-wm{height:31px;width:auto;display:block;margin-top:-3px}
.back{font:inherit;font-weight:700;font-size:14px;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:9px 16px;background:#fff}
.back:hover{border-color:var(--navy)}
.hero{background:linear-gradient(135deg,#0b1a2c,#16304d);color:#fff;border-radius:20px;padding:24px 22px;display:grid;gap:8px}
.hero h1{margin:0;font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(26px,4vw,38px);letter-spacing:-.015em;line-height:1.1}
.hero h1 em{font-style:italic;color:#ff9a7e}
.hero p{margin:0;color:#b8c6d8;font-size:16px;max-width:70ch}
.sua{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15px}
.sua b{font-weight:700}
.sua.on{display:flex}
.box{background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;min-height:200px}
.note{color:var(--muted);font-size:13px;margin:0}
.embed .top,.embed .hero{display:none}
.embed body{padding-top:12px}
@media (max-width:560px){.nv-wm{height:26px}.nv-ico{width:34px;height:34px}.top{padding:10px 12px}}
